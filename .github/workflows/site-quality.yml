name: StackGeist site quality

# Checks any proposed change without publishing or contacting Cloudflare.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build static site before content tests
        run: npm run build

      - name: Unit, routing and content regression tests
        run: npm test

      - name: Validate editorial queue and staged articles
        run: npm run editorial:validate
