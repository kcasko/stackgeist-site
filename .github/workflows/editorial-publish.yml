name: StackGeist editorial publishing

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
      timezone: 'America/Detroit'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only; turn off to publish an owner-approved article'
        type: boolean
        required: true
        default: true
      article_slug:
        description: 'Required for Publish Now; optional for dry-run'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: stackgeist-editorial-release
  cancel-in-progress: false

jobs:
  editorial-release:
    if: github.repository == 'kcasko/stackgeist-site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Select one owner-approved article, or exit safely
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_SLUG: ${{ inputs.article_slug }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" == "schedule" ]]; then
            node scripts/editorial-release.mjs --publish
          elif [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            if [[ -n "$RELEASE_SLUG" ]]; then
              node scripts/editorial-release.mjs --dry-run --slug "$RELEASE_SLUG"
            else
              node scripts/editorial-release.mjs --dry-run
            fi
          else
            if [[ -z "$RELEASE_SLUG" ]]; then
              echo "Publish Now requires an exact article_slug."
              exit 1
            fi
            node scripts/editorial-release.mjs --publish --slug "$RELEASE_SLUG"
          fi

      - name: Install dependencies
        if: steps.release.outputs.published == 'true'
        run: npm ci

      - name: Build production site
        if: steps.release.outputs.published == 'true'
        run: npm run build

      - name: Verify newly built article and its images
        if: steps.release.outputs.published == 'true'
        env:
          RELEASE_SLUG: ${{ steps.release.outputs.slug }}
        shell: bash
        run: node scripts/editorial-verify-build.mjs --slug "$RELEASE_SLUG"

      - name: Unit and content tests
        if: steps.release.outputs.published == 'true'
        run: npm test

      - name: Install Chromium
        if: steps.release.outputs.published == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser tests on candidate release
        if: steps.release.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8771 --bind 127.0.0.1 --directory dist >/tmp/stackgeist-preview.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          PLAYWRIGHT_BASE_URL='http://127.0.0.1:8771' npm run test:e2e

      - name: Commit validated publication to master
        if: steps.release.outputs.published == 'true'
        env:
          RELEASE_SLUG: ${{ steps.release.outputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stackgeist-editorial[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- editorial/queue.json editorial/staged src/data/catalog.ts src/pages public/illustrations
          git diff --cached --check
          git diff --cached --quiet && { echo "No publication changes; aborting."; exit 1; }
          git commit -m "content(publish): $RELEASE_SLUG"
          git push origin HEAD:master

      - name: Check Cloudflare Pages deployment status
        if: steps.release.outputs.published == 'true'
        run: |
          echo "Validated article pushed. Cloudflare Pages' GitHub integration builds from master."
          echo "The Cloudflare Pages check must succeed before the new page is considered live."
