<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Diagram: when Wi-Fi drops, check other devices; if everything drops the router, modem, or provider is likely; if only one PC drops, test it on a phone hotspot and fix the PC side"><title>Diagram: when Wi-Fi drops, check other devices; if everything drops the router, modem, or provider is likely; if only one PC drops, test it on a phone hotspot and fix the PC side</title><rect width="960" height="380" fill="#0e0a16"/><path d="M40 0V380M80 0V380M120 0V380M160 0V380M200 0V380M240 0V380M280 0V380M320 0V380M360 0V380M400 0V380M440 0V380M480 0V380M520 0V380M560 0V380M600 0V380M640 0V380M680 0V380M720 0V380M760 0V380M800 0V380M840 0V380M880 0V380M920 0V380M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960M0 360H960" stroke="#1b1427" stroke-width="1"/><path d="M18 32V18H32 M942 32V18H928 M18 348V362H32 M942 348V362H928" fill="none" stroke="#3b3846" stroke-width="2"/><text x="40" y="358" fill="#c084fc" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5">FIG. — ROUTER OR PC?</text><rect x="380" y="50" width="200" height="80" rx="10" fill="#151020" stroke="#f7f3fb" stroke-width="2"/><text x="400" y="84" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Wi-Fi drops</text><text x="400" y="108" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">Check other devices</text><path d="M430 130C430 170 250 160 250 200" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 130C530 170 710 160 710 200" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="200" width="240" height="110" rx="10" fill="#151020" stroke="#f2b872" stroke-width="2"/><text x="150" y="234" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">Everything drops</text><text x="150" y="260" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">Router, modem,</text><text x="150" y="280" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">or provider</text><rect x="590" y="200" width="240" height="110" rx="10" fill="rgba(163,230,53,.06)" stroke="#a3e635" stroke-width="2.5"/><text x="610" y="234" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">Only this PC drops</text><text x="610" y="260" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">Test on a phone hotspot,</text><text x="610" y="280" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">then fix the PC side</text></svg>