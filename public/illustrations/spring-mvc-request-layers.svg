<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Spring MVC request and validation flow"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.heading{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.note{font-size:15px}.box{fill:#f1f6fa;stroke:#8caebb;stroke-width:2}.green{fill:#e5f3e7;stroke:#71a37b;stroke-width:2}.yellow{fill:#fff1d9;stroke:#cda453;stroke-width:2}.arrow{stroke:#2b6c91;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2b6c91"/></marker></defs><text class="heading" x="40" y="43">Spring Boot: follow a request</text><rect class="box" x="32" y="112" width="204" height="103" rx="10"/><text class="head" x="53" y="146">Browser / form</text><text class="body" x="53" y="177">User enters data</text><path class="arrow" d="M236 164 L274 164"/><rect class="box" x="278" y="112" width="205" height="103" rx="10"/><text class="head" x="299" y="146">Controller</text><text class="body" x="299" y="177">Routes the action</text><path class="arrow" d="M483 164 L520 164"/><rect class="box" x="524" y="112" width="205" height="103" rx="10"/><text class="head" x="544" y="146">Business rules</text><text class="body" x="544" y="177">Checks inventory</text><path class="arrow" d="M729 164 L767 164"/><rect class="box" x="771" y="112" width="165" height="103" rx="10"/><text class="head" x="787" y="146">Repository</text><text class="body" x="787" y="177">Stores state</text><rect class="green" x="40" y="284" width="880" height="98" rx="10"/><text class="head" x="60" y="317">Response: view shows the updated state or validation errors.</text><text class="body" x="60" y="351">Test boundaries: below minimum, valid range, above maximum.</text><text class="note" x="40" y="429">Illustrative architecture, not copied WGU project code.</text></svg>