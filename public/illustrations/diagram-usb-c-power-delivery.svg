<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Diagram: a USB-C charger offers 5, 9, 15, and 20 volt profiles; the laptop requests 20 volts at 3.25 amps for 65 watts; a 3 amp cable caps 20 volts at 60 watts"><title>Diagram: a USB-C charger offers 5, 9, 15, and 20 volt profiles; the laptop requests 20 volts at 3.25 amps for 65 watts; a 3 amp cable caps 20 volts at 60 watts</title><rect width="960" height="420" fill="#ffffff"/><path d="M40 0V420M80 0V420M120 0V420M160 0V420M200 0V420M240 0V420M280 0V420M320 0V420M360 0V420M400 0V420M440 0V420M480 0V420M520 0V420M560 0V420M600 0V420M640 0V420M680 0V420M720 0V420M760 0V420M800 0V420M840 0V420M880 0V420M920 0V420M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960M0 360H960M0 400H960" stroke="#eeeeea" stroke-width="1"/><path d="M18 32V18H32 M942 32V18H928 M18 388V402H32 M942 388V402H928" fill="none" stroke="#121212" stroke-width="2"/><text x="40" y="398" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5">FIG. — USB POWER DELIVERY, SIMPLIFIED</text><rect x="40" y="90" width="220" height="220" rx="10" fill="#f6f6f3" stroke="#121212" stroke-width="2"/><text x="60" y="125" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Charger</text><text x="60" y="150" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">offers these profiles</text><rect x="60" y="166" width="180" height="26" rx="5" fill="#ffffff" stroke="#121212" stroke-width="1.5"/><text x="74" y="184" fill="#121212" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" text-anchor="start">5V</text><text x="150" y="184" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">3A</text><rect x="60" y="200" width="180" height="26" rx="5" fill="#ffffff" stroke="#121212" stroke-width="1.5"/><text x="74" y="218" fill="#121212" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" text-anchor="start">9V</text><text x="150" y="218" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">3A</text><rect x="60" y="234" width="180" height="26" rx="5" fill="#ffffff" stroke="#121212" stroke-width="1.5"/><text x="74" y="252" fill="#121212" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" text-anchor="start">15V</text><text x="150" y="252" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">3A</text><rect x="60" y="268" width="180" height="26" rx="5" fill="#ffffff" stroke="#121212" stroke-width="2.5"/><text x="74" y="286" fill="#121212" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" text-anchor="start">20V</text><text x="150" y="286" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">3.25A</text><path d="M260 200H380" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="380" y="160" width="200" height="80" rx="10" fill="#f6f6f3" stroke="#5f5f5a" stroke-width="2.5"/><text x="400" y="192" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Cable</text><text x="400" y="220" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">rated 3A or 5A</text><path d="M580 200H700" fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="700" y="90" width="220" height="220" rx="10" fill="#f6f6f3" stroke="#121212" stroke-width="2"/><text x="720" y="125" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Laptop</text><text x="720" y="150" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">requests one profile</text><rect x="720" y="180" width="180" height="40" rx="6" fill="rgba(255,207,46,.55)" stroke="#121212" stroke-width="2.5"/><text x="736" y="206" fill="#121212" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" text-anchor="start">20V × 3.25A = 65W</text><text x="720" y="254" fill="#9a5b00" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="600" text-anchor="start">No 20V offered?</text><text x="720" y="276" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">May charge slowly or not at all.</text><text x="400" y="290" fill="#9a5b00" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="600" text-anchor="start">A 3A cable caps 20V at 60W.</text><text x="400" y="312" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">Above 60W needs a 5A (100W) cable.</text></svg>