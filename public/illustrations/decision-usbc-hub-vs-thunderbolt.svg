<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="USB-C versus Thunderbolt buying decision"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.heading{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.note{font-size:15px}.box{fill:#f1f6fa;stroke:#8caebb;stroke-width:2}.green{fill:#e5f3e7;stroke:#71a37b;stroke-width:2}.yellow{fill:#fff1d9;stroke:#cda453;stroke-width:2}.arrow{stroke:#2b6c91;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2b6c91"/></marker></defs><text class="heading" x="35" y="43">Choose from the laptop outward</text><rect class="box" x="38" y="85" width="272" height="105" rx="10"/><text class="head" x="54" y="118">1. Laptop port</text><text class="body" x="54" y="149">Check video and charging</text><path class="arrow" d="M310 135 L350 135"/><rect class="box" x="354" y="85" width="272" height="105" rx="10"/><text class="head" x="370" y="118">2. Display needs</text><text class="body" x="370" y="149">Count, mode, OS limits</text><path class="arrow" d="M626 135 L664 135"/><rect class="box" x="670" y="85" width="254" height="105" rx="10"/><text class="head" x="689" y="118">3. Devices</text><text class="body" x="689" y="149">Network, USB, storage</text><rect class="green" x="40" y="253" width="406" height="128" rx="10"/><text class="head" x="60" y="287">USB-C hub</text><text class="body" x="60" y="321">Best for basic compatible</text><text class="body" x="60" y="347">ports and portable use</text><rect class="yellow" x="514" y="253" width="408" height="128" rx="10"/><text class="head" x="534" y="287">Thunderbolt dock</text><text class="body" x="534" y="321">Best when high-speed ports</text><text class="body" x="534" y="347">are actually required</text><text class="note" x="40" y="424">A USB-C connector shape never guarantees two displays.</text></svg>