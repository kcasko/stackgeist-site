<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Diagram: a Windows 11 client using VMware NAT DNS cannot find the domain; pointed at the domain controller DNS at 10.20.30.10 it finds the domain and the join succeeds"><title>Diagram: a Windows 11 client using VMware NAT DNS cannot find the domain; pointed at the domain controller DNS at 10.20.30.10 it finds the domain and the join succeeds</title><rect width="960" height="400" fill="#ffffff"/><path d="M40 0V400M80 0V400M120 0V400M160 0V400M200 0V400M240 0V400M280 0V400M320 0V400M360 0V400M400 0V400M440 0V400M480 0V400M520 0V400M560 0V400M600 0V400M640 0V400M680 0V400M720 0V400M760 0V400M800 0V400M840 0V400M880 0V400M920 0V400M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960M0 360H960" stroke="#eeeeea" stroke-width="1"/><path d="M18 32V18H32 M942 32V18H928 M18 368V382H32 M942 368V382H928" fill="none" stroke="#121212" stroke-width="2"/><text x="40" y="378" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5">FIG. — WHY A CLIENT NEEDS DOMAIN DNS</text><rect x="40" y="140" width="200" height="110" rx="10" fill="#f6f6f3" stroke="#121212" stroke-width="2"/><text x="60" y="176" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">WIN11-01</text><text x="60" y="200" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">joining the domain</text><text x="60" y="226" fill="#121212" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">ad.bytegeist.lab</text><path d="M240 170C330 170 340 100 420 100" fill="none" stroke="#9a5b00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="60" width="240" height="80" rx="10" fill="#f6f6f3" stroke="#9a5b00" stroke-width="2"/><text x="440" y="92" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">VMware NAT DNS</text><text x="440" y="116" fill="#9a5b00" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">doesn't know the domain</text><path d="M240 220C330 220 340 290 420 290" fill="none" stroke="#121212" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="250" width="240" height="80" rx="10" fill="rgba(255,207,46,.55)" stroke="#121212" stroke-width="2.5"/><text x="440" y="282" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">DC01 DNS  .10</text><text x="440" y="306" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">returns the DC records</text><path d="M660 290H740" fill="none" stroke="#121212" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="740" y="250" width="180" height="80" rx="10" fill="#f6f6f3" stroke="#121212" stroke-width="2"/><text x="760" y="282" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">Join succeeds</text><text x="760" y="306" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">LDAP port 389 open</text><text x="440" y="180" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">Set-DnsClientServerAddress … 10.20.30.10</text></svg>