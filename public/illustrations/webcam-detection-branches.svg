<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="Windows webcam diagnosis by detection state"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.h{font-size:26px;font-weight:bold}.b{font-size:18px;font-weight:bold}.p{font-size:16px}.s{font-size:14px}.box{fill:#f1f5f8;stroke:#709eae;stroke-width:2}.ok{fill:#e7f4ea;stroke:#67a078;stroke-width:2}.no{fill:#fff0df;stroke:#ca935d;stroke-width:2}.a{stroke:#245b7f;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#245b7f"/></marker></defs><text class="h" x="42" y="43">Webcam troubleshooting: locate the failing layer</text><rect class="box" x="42" y="88" width="270" height="90" rx="10"/><text class="b" x="62" y="118">Device Manager</text><text class="p" x="62" y="150">Does camera appear?</text><path class="a" d="M312 134L362 134"/><rect class="box" x="365" y="88" width="256" height="90" rx="10"/><text class="b" x="385" y="118">Windows Camera</text><text class="p" x="385" y="150">Is preview available?</text><path class="a" d="M621 134L665 134"/><rect class="box" x="668" y="88" width="248" height="90" rx="10"/><text class="b" x="688" y="118">Meeting app</text><text class="p" x="688" y="150">Does it have access?</text><rect class="no" x="42" y="246" width="415" height="120" rx="10"/><text class="b" x="62" y="280">Hardware not enumerating</text><text class="p" x="62" y="309">Try direct port / another host</text><text class="p" x="62" y="339">before changing applications</text><rect class="ok" x="505" y="246" width="410" height="120" rx="10"/><text class="b" x="525" y="280">Detected, but app fails</text><text class="p" x="525" y="309">Review camera privacy, app</text><text class="p" x="525" y="339">selection and competing apps</text><text class="s" x="45" y="420">Illustration of a diagnostic sequence. Not a Windows screenshot.</text></svg>