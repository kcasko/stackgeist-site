<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" role="img"><title>Risk to issue to change</title><rect width="860" height="190" rx="12" fill="#f7f4ed"/><text x="24" y="40" font-size="23" font-weight="700" font-family="Arial,sans-serif" fill="#203a35">Risk to issue to change</text><g font-family="Arial,sans-serif"><rect x="24" y="70" width="260" height="78" rx="8" fill="#eee4d6" stroke="#496b5e"/><text x="154" y="100" font-size="18" text-anchor="middle" font-weight="700" fill="#203a35">Risk: might occur</text><text x="154" y="124" font-size="12" text-anchor="middle" fill="#36514d">Vendor might be late</text><rect x="300" y="70" width="260" height="78" rx="8" fill="#dfeae3" stroke="#496b5e"/><text x="430" y="100" font-size="18" text-anchor="middle" font-weight="700" fill="#203a35">Issue: has occurred</text><text x="430" y="124" font-size="12" text-anchor="middle" fill="#36514d">Vendor confirms delay</text><rect x="576" y="70" width="260" height="78" rx="8" fill="#eee4d6" stroke="#496b5e"/><text x="706" y="100" font-size="18" text-anchor="middle" font-weight="700" fill="#203a35">Change: approval if needed</text><text x="706" y="124" font-size="12" text-anchor="middle" fill="#36514d">Schedule baseline affected?</text></g></svg>