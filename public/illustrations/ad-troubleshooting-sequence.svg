<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Active Directory domain client troubleshooting order"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.heading{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.note{font-size:15px}.box{fill:#f1f6fa;stroke:#8caebb;stroke-width:2}.green{fill:#e5f3e7;stroke:#71a37b;stroke-width:2}.yellow{fill:#fff1d9;stroke:#cda453;stroke-width:2}.arrow{stroke:#2b6c91;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2b6c91"/></marker></defs><text class="heading" x="40" y="43">Domain sign-in: verify basics first</text><rect class="box" x="31" y="108" width="278" height="116" rx="10"/><text class="head" x="51" y="145">1. Network</text><text class="body" x="51" y="179">Client can reach DC?</text><path class="arrow" d="M309 166 L350 166"/><rect class="box" x="354" y="108" width="271" height="116" rx="10"/><text class="head" x="374" y="145">2. AD DNS</text><text class="body" x="374" y="179">SRV record resolves?</text><path class="arrow" d="M625 166 L660 166"/><rect class="box" x="664" y="108" width="267" height="116" rx="10"/><text class="head" x="684" y="145">3. Domain trust</text><text class="body" x="684" y="179">Secure channel valid?</text><rect class="green" x="40" y="280" width="880" height="116" rx="10"/><text class="head" x="60" y="316">Verify and document</text><text class="body" x="60" y="347">Test-ComputerSecureChannel   |   nltest /dsgetdc:ad.bytegeist.lab</text><text class="note" x="60" y="377">Record observed output, fix, and remaining risk.</text><text class="note" x="40" y="429">Illustrative sequence, not a claim that checks ran today.</text></svg>