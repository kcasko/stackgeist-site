<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Momentum 4 pairing versus reset"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.heading{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.note{font-size:15px}.box{fill:#f1f6fa;stroke:#8caebb;stroke-width:2}.green{fill:#e5f3e7;stroke:#71a37b;stroke-width:2}.yellow{fill:#fff1d9;stroke:#cda453;stroke-width:2}.arrow{stroke:#2b6c91;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2b6c91"/></marker></defs><text class="heading" x="35" y="43">MOMENTUM 4: pairing before reset</text><rect class="box" x="30" y="90" width="283" height="110" rx="10"/><text class="head" x="46" y="125">1. Pairing mode</text><text class="body" x="46" y="156">Off, then hold button 5s</text><path class="arrow" d="M313 147 L346 147"/><rect class="box" x="350" y="90" width="280" height="110" rx="10"/><text class="head" x="368" y="125">2. Forget old record</text><text class="body" x="368" y="156">Retry from Bluetooth menu</text><path class="arrow" d="M630 147 L664 147"/><rect class="box" x="668" y="90" width="264" height="110" rx="10"/><text class="head" x="687" y="125">3. Test another host</text><text class="body" x="687" y="156">Is the problem local?</text><rect class="green" x="30" y="260" width="426" height="124" rx="10"/><text class="head" x="50" y="297">Another host works</text><text class="body" x="50" y="328">Fix original host Bluetooth</text><text class="body" x="50" y="354">state, not the headphones</text><rect class="yellow" x="500" y="260" width="432" height="124" rx="10"/><text class="head" x="520" y="297">Headphones malfunction</text><text class="body" x="520" y="328">~20s reset per Sennheiser</text><text class="body" x="520" y="354">Factory reset deletes pairings</text><text class="note" x="35" y="430">Conceptual sequence, not a physical button-position guide.</text></svg>