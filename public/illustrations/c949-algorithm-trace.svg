<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Illustrative insertion sort trace"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.heading{font-size:28px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:17px}.note{font-size:15px}.box{fill:#f1f6fa;stroke:#8caebb;stroke-width:2}.green{fill:#e5f3e7;stroke:#71a37b;stroke-width:2}.yellow{fill:#fff1d9;stroke:#cda453;stroke-width:2}.arrow{stroke:#2b6c91;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2b6c91"/></marker></defs><text class="heading" x="40" y="43">Trace the algorithm, do not guess</text><text class="body" x="44" y="79">Example: insertion sort maintains a sorted prefix.</text><rect class="box" x="40" y="106" width="880" height="80" rx="10"/><text class="head" x="60" y="141">Start</text><text class="head" x="270" y="141">[ 5, 2, 4, 1 ]</text><text class="body" x="604" y="141">Prefix [5]</text><path class="arrow" d="M480 187 L480 220"/><rect class="box" x="40" y="232" width="880" height="75" rx="10"/><text class="head" x="60" y="265">Pass 1</text><text class="head" x="270" y="265">[ 2, 5, 4, 1 ]</text><text class="body" x="604" y="265">Insert 2 before 5</text><path class="arrow" d="M480 308 L480 340"/><rect class="green" x="40" y="351" width="880" height="70" rx="10"/><text class="head" x="60" y="387">Pass 2</text><text class="head" x="270" y="387">[ 2, 4, 5, 1 ]</text><text class="body" x="604" y="387">Insert 4 between 2 and 5</text><text class="note" x="43" y="438">Practice the next pass on paper, then explain complexity.</text></svg>