<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="MicroSD card non-destructive troubleshooting decision tree"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.h{font-size:26px;font-weight:bold}.b{font-size:18px;font-weight:bold}.p{font-size:16px}.s{font-size:14px}.box{fill:#f1f5f8;stroke:#709eae;stroke-width:2}.ok{fill:#e7f4ea;stroke:#67a078;stroke-width:2}.no{fill:#fff0df;stroke:#ca935d;stroke-width:2}.a{stroke:#245b7f;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#245b7f"/></marker></defs><text class="h" x="44" y="43">microSD: inspect before writing</text><rect class="box" x="40" y="85" width="262" height="110" rx="10"/><text class="b" x="59" y="120">Card absent</text><text class="p" x="59" y="149">Try known-good reader</text><text class="p" x="59" y="174">and supported second host</text><path class="a" d="M302 137L343 137"/><rect class="box" x="348" y="85" width="272" height="110" rx="10"/><text class="b" x="367" y="120">Card detected</text><text class="p" x="367" y="149">Open Disk Management</text><text class="p" x="367" y="174">or read-only Get-Disk</text><path class="a" d="M620 137L664 137"/><rect class="box" x="667" y="85" width="256" height="110" rx="10"/><text class="b" x="686" y="120">Inspect state</text><text class="p" x="686" y="149">Healthy / RAW /</text><text class="p" x="686" y="174">Unallocated</text><rect class="ok" x="40" y="253" width="407" height="122" rx="10"/><text class="b" x="59" y="287">Healthy, no letter</text><text class="p" x="59" y="317">Consider assigning unused letter</text><text class="p" x="59" y="345">without formatting</text><rect class="no" x="503" y="253" width="420" height="122" rx="10"/><text class="b" x="522" y="287">RAW or unexpected Unallocated</text><text class="p" x="522" y="317">Stop writes and assess recovery</text><text class="p" x="522" y="345">before initializing or formatting</text><text class="s" x="45" y="421">Illustrative guidance; does not imply a recovery operation was performed.</text></svg>