<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="USB-C hub USB data power and video diagnostic paths"><rect width="960" height="450" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#243948}.h{font-size:26px;font-weight:bold}.b{font-size:18px;font-weight:bold}.p{font-size:16px}.s{font-size:14px}.box{fill:#f1f5f8;stroke:#709eae;stroke-width:2}.ok{fill:#e7f4ea;stroke:#67a078;stroke-width:2}.no{fill:#fff0df;stroke:#ca935d;stroke-width:2}.a{stroke:#245b7f;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#245b7f"/></marker></defs><text class="h" x="44" y="43">USB-C has separate capabilities</text><rect class="box" x="40" y="85" width="247" height="102" rx="10"/><text class="b" x="59" y="119">USB data</text><text class="p" x="59" y="147">Ethernet and devices</text><path class="a" d="M287 137L347 137"/><rect class="box" x="351" y="85" width="250" height="102" rx="10"/><text class="b" x="371" y="119">USB-C power</text><text class="p" x="371" y="147">Charging negotiation</text><path class="a" d="M601 137L659 137"/><rect class="box" x="663" y="85" width="259" height="102" rx="10"/><text class="b" x="680" y="119">Display signal</text><text class="p" x="680" y="147">DP Alt Mode / USB4</text><rect class="ok" x="40" y="250" width="411" height="120" rx="10"/><text class="b" x="60" y="284">Ethernet works</text><text class="p" x="60" y="315">USB data path is operating;</text><text class="p" x="60" y="344">video is not yet established</text><rect class="no" x="505" y="250" width="416" height="120" rx="10"/><text class="b" x="525" y="284">HDMI remains black</text><text class="p" x="525" y="315">Check host video, upstream</text><text class="p" x="525" y="344">cable, display mode and HDMI</text><text class="s" x="44" y="422">Ethernet working does not prove that the laptop outputs video.</text></svg>