<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Diagram: four steps in order: stop writing, diagnose, recover files to a different drive, then repair the partition table"><title>Diagram: four steps in order: stop writing, diagnose, recover files to a different drive, then repair the partition table</title><rect width="960" height="360" fill="#ffffff"/><path d="M40 0V360M80 0V360M120 0V360M160 0V360M200 0V360M240 0V360M280 0V360M320 0V360M360 0V360M400 0V360M440 0V360M480 0V360M520 0V360M560 0V360M600 0V360M640 0V360M680 0V360M720 0V360M760 0V360M800 0V360M840 0V360M880 0V360M920 0V360M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960" stroke="#eeeeea" stroke-width="1"/><path d="M18 32V18H32 M942 32V18H928 M18 328V342H32 M942 328V342H928" fill="none" stroke="#121212" stroke-width="2"/><text x="40" y="338" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5">FIG. — RECOVER FIRST, REPAIR LAST</text><rect x="40" y="90" width="195" height="170" rx="10" fill="#f6f6f3" stroke="#9a5b00" stroke-width="2.5"/><text x="60" y="124" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">01</text><text x="60" y="156" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Stop writing</text><text x="60" y="188" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">Cancel format and</text><text x="60" y="208" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">initialize prompts</text><path d="M235 175H265" fill="none" stroke="#5f5f5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="265" y="90" width="195" height="170" rx="10" fill="rgba(255,207,46,.55)" stroke="#121212" stroke-width="2"/><text x="285" y="124" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">02</text><text x="285" y="156" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Diagnose</text><text x="285" y="188" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">Compare disk and</text><text x="285" y="208" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">partition sizes</text><path d="M460 175H490" fill="none" stroke="#5f5f5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="90" width="195" height="170" rx="10" fill="rgba(255,207,46,.55)" stroke="#121212" stroke-width="2"/><text x="510" y="124" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">03</text><text x="510" y="156" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Recover</text><text x="510" y="188" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">Copy files to a</text><text x="510" y="208" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">different drive</text><path d="M685 175H715" fill="none" stroke="#5f5f5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="715" y="90" width="195" height="170" rx="10" fill="rgba(255,207,46,.55)" stroke="#121212" stroke-width="2"/><text x="735" y="124" fill="#5f5f5a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">04</text><text x="735" y="156" fill="#121212" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="20" font-weight="600" text-anchor="start">Repair</text><text x="735" y="188" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">Fix or recreate the</text><text x="735" y="208" fill="#5f5f5a" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="500" text-anchor="start">partition table</text><text x="40" y="304" fill="#9a5b00" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="15" font-weight="600" text-anchor="start">Every write before step 03 can overwrite what recovery tools need.</text></svg>