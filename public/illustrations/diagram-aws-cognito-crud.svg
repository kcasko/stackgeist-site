<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Diagram: a signed-in browser gets a JWT from Cognito, calls API Gateway with a JWT authorizer, which invokes Lambda that checks record ownership before reading DynamoDB"><title>Diagram: a signed-in browser gets a JWT from Cognito, calls API Gateway with a JWT authorizer, which invokes Lambda that checks record ownership before reading DynamoDB</title><rect width="960" height="380" fill="#0e0a16"/><path d="M40 0V380M80 0V380M120 0V380M160 0V380M200 0V380M240 0V380M280 0V380M320 0V380M360 0V380M400 0V380M440 0V380M480 0V380M520 0V380M560 0V380M600 0V380M640 0V380M680 0V380M720 0V380M760 0V380M800 0V380M840 0V380M880 0V380M920 0V380M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960M0 360H960" stroke="#1b1427" stroke-width="1"/><path d="M18 32V18H32 M942 32V18H928 M18 348V362H32 M942 348V362H928" fill="none" stroke="#3b3846" stroke-width="2"/><text x="40" y="358" fill="#c084fc" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1.5">FIG. — PRIVATE CRUD ON AWS</text><rect x="40" y="140" width="150" height="90" rx="10" fill="#151020" stroke="#f7f3fb" stroke-width="2"/><text x="60" y="176" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">Browser</text><text x="60" y="200" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">signed-in user</text><path d="M190 160C240 160 240 100 290 100" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="60" width="170" height="80" rx="10" fill="#151020" stroke="#c084fc" stroke-width="2.5"/><text x="310" y="94" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">Cognito</text><text x="310" y="118" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">issues a JWT</text><path d="M190 205H290" fill="none" stroke="#a3e635" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="170" width="170" height="80" rx="10" fill="rgba(163,230,53,.06)" stroke="#a3e635" stroke-width="2.5"/><text x="310" y="204" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">API Gateway</text><text x="310" y="228" fill="#a3e635" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">JWT authorizer</text><path d="M460 210H540" fill="none" stroke="#a3e635" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="540" y="170" width="170" height="80" rx="10" fill="#151020" stroke="#f7f3fb" stroke-width="2"/><text x="560" y="204" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">Lambda</text><text x="560" y="228" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">checks the owner</text><path d="M710 210H790" fill="none" stroke="#a3e635" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="170" width="140" height="80" rx="10" fill="#151020" stroke="#f7f3fb" stroke-width="2"/><text x="810" y="204" fill="#f7f3fb" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="18" font-weight="600" text-anchor="start">DynamoDB</text><text x="810" y="228" fill="#a59bab" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" text-anchor="start">per-user items</text><text x="290" y="300" fill="#f2b872" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="15" font-weight="600" text-anchor="start">No valid token: request rejected before Lambda runs.</text></svg>